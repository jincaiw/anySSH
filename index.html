<!-- `lang` is the product default; the Rust setup() hook rewrites it before
     the first paint from the persisted `app_language` setting (or the
     ANYSSH_UI_LANG override), and the i18n store keeps it in sync after that. -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>anySSH</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
