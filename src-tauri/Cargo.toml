[package]
name = "anyssh"
version = "0.0.0-dev"
description = "A modern desktop client for SSH, SFTP, and S3"
authors = ["Nevil Macwan <macnev2013@gmail.com>"]
license = "MIT"
repository = "https://github.com/jincaiw/anySSH"
homepage = "https://github.com/jincaiw/anySSH"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "anyssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SSH (pure Rust, async)
#
# 0.63.3 merges the old `russh-keys` crate into `russh::keys`.
# `default-features = false` + explicit crypto backend: `ring` keeps a single
# crypto backend across the whole binary (rustls/tokio-rustls already use ring)
# and avoids aws-lc-rs' NASM requirement on Windows x64.
#   - `rsa`    : needed for `ssh_key::Algorithm::Rsa` (host key + private key)
#   - `des`    : needed for `cipher::TRIPLE_DES_CBC` (legacy device support)
#   - `flate2` : keeps zlib@openssh.com compression
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa", "flate2", "des"] }
async-trait = "0.1"

# Character set conversion for terminal I/O (GBK/Big5/Shift_JIS/EUC-*/… ↔ UTF-8)
encoding_rs = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"

# Unique session IDs
uuid = { version = "1", features = ["v4"] }

# Concurrent session map
dashmap = "6"

# SQLite persistence
rusqlite = { version = "0.31", features = ["bundled"] }

# File watching (for edit-in-vscode re-upload on save)
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }

# SFTP. 3.0.0 is transport-agnostic (no russh dependency of its own): the
# session is built from any `AsyncRead + AsyncWrite` channel stream, so the
# russh version bump does not constrain it.
russh-sftp = "3.0.0"

# Cancellation tokens for in-flight transfers
tokio-util = { version = "0.7" }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OS credential store: macOS Keychain (apple-native), Windows DPAPI
# (windows-native), Linux kernel keyutils (linux-native — name is misleading;
# it's the keyutils backend, not libsecret). On Linux, PAM normally sets up
# a session keyring on login; in containers you need `keyctl session` + a
# non-default seccomp profile.
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Native clipboard read/write. The webview's navigator.clipboard.readText() is
# blocked in the macOS WKWebView, so terminal paste (#71) reads through this.
tauri-plugin-clipboard-manager = "2.3.2"
# Native OS drag-out: hands real local file handles to the OS so files can be
# dragged from the Explorer onto the desktop/Finder. The HTML5 DataTransfer API
# cannot do this from a webview (see drag-out comment in ExplorerFileTable). We
# use the `drag` crate directly (rather than tauri-plugin-drag) so the drag is
# driven from a backend command that only ever hands the OS validated staging
# paths — the webview can't name an arbitrary local file to drag out.
drag = "2"
ssh2-config = "0.7.0"
rust-s3 = { version = "0.37.1", default-features = false, features = ["tokio-rustls-tls"] }

# Encrypted backup/restore: Argon2id key derivation + AES-256-GCM, written as a
# compact binary container (no JSON/base64). `getrandom` provides the OS CSPRNG
# for the per-backup salt and nonce.
argon2 = "0.5"
aes-gcm = "0.10"
getrandom = "0.2"
# Compress the backup payload before encrypting — a raw SQLite snapshot is
# mostly zero-filled pages, so this shrinks the file ~10-50x. Pure-Rust backend.
flate2 = "1"

# Telemetry
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "6"

# Local timestamps for terminal session logs (file naming, line stamps)
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Local terminal (P1a): cross-platform PTY (ConPTY on Windows, forkpty on
# Unix) for the `term` layer's local backend.
portable-pty = "0.9"

# Local terminal shutdown: portable-pty's `Child::kill()` only sends SIGHUP to
# the shell (which it may ignore) and never reaches foreground jobs. We need
# `kill(2)` on the process group to guarantee the PTY's slave end is released.
libc = "0.2"

# Telnet login scripts (P1b): byte-oriented regex for the expect steps.
regex = "1"

# Serial (P2): cross-platform serial port enumeration + I/O. MPL-2.0.
# On Linux the udev feature is optional (needed for USB metadata only).
serialport = { version = "4", default-features = false }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
ironrdp-rdcleanpath = "=0.2.2"
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tempfile = "3"
hostname = "0.4"

[dev-dependencies]
rcgen = "0.14.10"
# `ChannelMsg::Data` carries `bytes::Bytes` since russh 0.58; the exec tests
# build payloads with `Bytes::from_static`.
bytes = "1"

# Reached for directly (not through tauri-plugin-dialog) to put a startup failure
# on screen. `MessageDialogBuilder::blocking_show` routes the dialog through
# `AppHandle::run_on_main_thread`, and its own docs say it must not be called from
# the main thread — which is exactly where `setup()` runs: measured, the call
# returned after ~4s without a click, so nothing ever waited for a human. `rfd`'s
# blocking `show()` is the main-thread modal (`NSAlert::runModal` on macOS), which
# is the supported way to do this before the event loop starts. Same version and
# same target set as the plugin's own dependency, with default features off so the
# feature union is unchanged (the plugin's `gtk3` default still supplies the Linux
# backend); it therefore adds no new code to the binary.
#
# Kept last on purpose: a `[table]` header placed mid-section captures every key
# after it, which silently deleted the rest of [dependencies] the first time this
# was written (the build then failed with "Permission
# clipboard-manager:allow-read-text not found" because the plugin had fallen out
# of the graph).
#
# The requirement is inline rather than a `version = "0.16"` line below the header
# for a second, nastier reason: release.yml sets the package version with
# `sed -i 's/^version = ".*"/version = "$VERSION"/'`, which cannot tell the package
# version from a dependency's. As a separate line it became `^0.15.1` at build
# time, resolved to rfd 0.15.4, and that older release aborts its build script on
# Linux with "You need to choose at least one backend: gtk3 or xdg-portal" — the
# release lost its Linux artifacts while macOS and Windows built fine. Inline, the
# line does not start with `version`, so the release sed cannot see it.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
rfd = { version = "0.16", default-features = false }
